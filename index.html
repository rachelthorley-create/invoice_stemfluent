<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>STEMfluent — Invoice Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pageW:794px;--pageH:1123px}
html,body{margin:0;font-family:Montserrat,Arial;background:#f3f3f5}

/* PIN overlay */
#pinOverlay{position:fixed;inset:0;background:#1a1a2e;display:flex;align-items:center;justify-content:center;z-index:9999}
#pinBox{background:#fff;border-radius:12px;padding:40px;text-align:center;width:280px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
#pinBox h2{margin:0 0 8px;font-size:22px;font-family:Montserrat}
#pinBox p{margin:0 0 20px;color:#666;font-size:13px}
#pinInput{width:100%;padding:12px;font-size:20px;letter-spacing:6px;text-align:center;border:2px solid #ddd;border-radius:8px;font-family:Montserrat;box-sizing:border-box}
#pinInput:focus{outline:none;border-color:#111}
#pinBtn{margin-top:12px;width:100%;padding:12px;background:#111;color:#fff;border:0;border-radius:8px;font-family:Montserrat;font-size:14px;cursor:pointer}
#pinError{color:#c00;font-size:13px;margin-top:10px;min-height:18px}

.app{display:flex;gap:24px;padding:20px}
.panel{width:360px;background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.08)}
label{display:block;font-size:13px;margin:10px 0 6px}
input,select,textarea{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;font-family:Montserrat}
textarea{min-height:80px}
button{margin-top:8px;padding:8px 10px;border-radius:6px;border:0;background:#111;color:#fff;cursor:pointer;font-family:Montserrat}
.btn-ghost{background:#fff;border:1px solid #ccc;color:#111}

.canvas-wrap{flex:1;display:flex;justify-content:center}
.page{width:794px;min-height:1123px;background:#fff;position:relative;box-shadow:0 10px 30px rgba(0,0,0,0.1);overflow:hidden}
.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.content{position:relative;padding:80px}

.logo{position:absolute;right:80px;top:60px;text-align:right}
.logo h1{margin:0;font-size:30px;font-family:Montserrat}
.company-meta{font-size:12px;color:#666;margin-top:6px}

.big-title{font-size:100px;letter-spacing:8px;margin:120px 0 60px;font-weight:800}

.meta{display:flex;justify-content:space-between;margin-bottom:30px;gap:40px}
.meta > div{width:50%}
#lblBill{display:block;word-break:break-word}

table{width:100%;border-collapse:collapse;margin-top:20px}
thead td{font-weight:700;border-bottom:2px dotted #ccc;padding:10px 6px}
tbody td{border-bottom:1px dotted #e5e5e5;padding:12px 6px;vertical-align:middle}
td.amount{text-align:right}

.remove-btn{background:#fff;border:1px solid #ccc;padding:2px 6px;border-radius:4px;cursor:pointer}

.total-row{display:flex;justify-content:flex-end;margin-top:30px;font-size:22px;font-weight:700}
.discount-row{display:flex;justify-content:flex-end;margin-top:8px;font-size:16px;color:#666}

.notes-section{margin-top:40px;white-space:pre-wrap}

.bank{margin-top:40px;border-top:1px dotted #ccc;padding-top:20px}
.bank b{display:inline-block;width:130px}

.footer{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:#777}

/* inline editable cells */
.editable-input{border:1px solid #ddd;border-radius:4px;padding:4px 6px;font-family:Montserrat;font-size:14px;min-width:40px}
.editable-number{width:60px}

/* Export mode: replace inputs with plain text spans so nothing is cut off */
.export-mode .remove-btn{display:none !important}
.export-mode .editable-input{display:none !important}
.export-mode .export-text{display:inline !important}
.export-text{display:none}
.export-mode input[type=number].editable-input{display:none}
</style>
</head>
<body>

<!-- PIN Gate -->
<div id="pinOverlay">
  <div id="pinBox">
    <h2>STEMfluent.</h2>
    <p>Enter PIN to access invoice generator</p>
    <input id="pinInput" type="password" maxlength="6" placeholder="••••" autocomplete="off" />
    <button id="pinBtn">Unlock</button>
    <div id="pinError"></div>
  </div>
</div>

<div class="app" id="mainApp" style="display:none">

<div class="panel">
<h3>Controls</h3>

<label>Currency</label>
<select id="currencySelect">
<option value="GBP">GBP (£)</option>
<option value="USD">USD ($)</option>
<option value="EUR">EUR (€)</option>
</select>

<label>Exchange Rate (per 1 GBP)</label>
<input id="rateUSD" type="number" step="0.01" value="1.35">
<input id="rateEUR" type="number" step="0.01" value="1.15">

<label>Invoice number</label>
<input id="invoiceNumber" type="number" value="53" />

<label>Date</label>
<input id="invoiceDate" type="text" />

<label>Bill to</label>
<input id="billTo" type="text" value="FAO " />

<label>Discount %</label>
<input id="discount" type="number" value="0" min="0" max="100" />

<label>Add Item</label>
<select id="itemSelect"></select>
<button id="addSelected" class="btn-ghost">Add Selected Item</button>
<button id="addItem" class="btn-ghost">Add Blank Item</button>

<label>Free Text / Notes</label>
<textarea id="freeText"></textarea>

<label>Show bank details on invoice</label>
<select id="bankToggle">
  <option value="1">Yes – show bank details</option>
  <option value="0">No – hide bank details</option>
</select>

<button id="exportPng">Download PNG</button>
<button id="exportPdf">Download PDF</button>

</div>

<div class="canvas-wrap">
<div id="invoicePage" class="page">

<svg class="bgsvg" viewBox="0 0 794 1123" preserveAspectRatio="none">
<polygon points="0,0 250,0 0,350" fill="#777"/>
<polygon points="0,250 400,0 0,600" fill="#bbb" opacity="0.6"/>
</svg>

<div class="content">

<div class="logo">
<h1>STEMfluent.</h1>
<div class="company-meta">Registered company: 14959530<br>Churchill College, Cambridge</div>
</div>

<div class="big-title">INVOICE</div>

<div class="meta">
<div>
<div><b>Invoice No:</b> <span id="lblInvoice"></span></div>
<div><b>Bill to:</b> <span id="lblBill"></span></div>
</div>
<div>
<div><b>Date:</b> <span id="lblDate"></span></div>
</div>
</div>

<table>
<thead>
<tr>
<td style="width:30px">#</td>
<td>Description</td>
<td style="width:70px">Qty</td>
<td class="amount" style="width:100px" id="amountHeader"></td>
<td style="width:30px"></td>
</tr>
</thead>
<tbody id="itemsBody"></tbody>
</table>

<div id="discountRow" class="discount-row" style="display:none"></div>
<div class="total-row">Total: <span id="totalValue"></span></div>

<div id="notesSection" class="notes-section"></div>

<div class="bank" id="bankSection">
<div><b>Bank name:</b> Rachel Thorley</div>
<div><b>Account:</b> 04-00-03 32508524</div>
<div><b>Bank:</b> Monzo</div>
</div>

<div class="footer">Email: rachelthorley@gmail.com</div>

</div>
</div>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
// ── PIN ──────────────────────────────────────────────────────────────────────
// Change this to your desired PIN before hosting.
// This is a simple client-side check — fine for casual security (keeps the
// page off search engines / casual visitors) but not cryptographically strong.
const CORRECT_PIN = "1234";

function checkPin(){
  const entered = document.getElementById("pinInput").value;
  if(entered === CORRECT_PIN){
    document.getElementById("pinOverlay").style.display = "none";
    document.getElementById("mainApp").style.display = "flex";
  } else {
    document.getElementById("pinError").textContent = "Incorrect PIN — try again";
    document.getElementById("pinInput").value = "";
  }
}

document.getElementById("pinBtn").onclick = checkPin;
document.getElementById("pinInput").addEventListener("keydown", e => {
  if(e.key === "Enter") checkPin();
  document.getElementById("pinError").textContent = "";
});

// ── App ───────────────────────────────────────────────────────────────────────
const currencySymbols = {GBP:"£", USD:"$", EUR:"€"};

const catalog = [
  {name:"Pottery Workshop",         price:250},
  {name:"Plant label - small",      price:5.99},
  {name:"Plant label - medium",     price:6.99},
  {name:"Plant label - large",      price:7.99},
  {name:"Postage",                  price:0},
  {name:"Educational Workshop",     price:500}
];

function getTodayDate(){
  const d = new Date();
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}

const state = {
  currency:"GBP",
  invoiceNumber:53,
  date:getTodayDate(),
  billTo:"FAO ",
  items:[],
  discount:0,
  notes:"",
  showBank:true
};

const sel = document.getElementById("itemSelect");
catalog.forEach((it,i) => {
  const o = document.createElement("option");
  o.value = i;
  o.textContent = `${it.name} (£${it.price})`;
  sel.appendChild(o);
});

function getRate(){
  if(state.currency==="USD") return parseFloat(document.getElementById("rateUSD").value)||1;
  if(state.currency==="EUR") return parseFloat(document.getElementById("rateEUR").value)||1;
  return 1;
}
function convert(price){ return price * getRate(); }
function symbol(){ return currencySymbols[state.currency]; }
function fmt(n){ return symbol() + Number(n).toFixed(2); }

function render(){
  document.getElementById("lblInvoice").textContent = String(state.invoiceNumber).padStart(8,"0");
  document.getElementById("lblDate").textContent    = state.date;
  document.getElementById("lblBill").textContent    = state.billTo;
  document.getElementById("amountHeader").textContent = "Amount / " + symbol();
  document.getElementById("notesSection").textContent = state.notes;
  document.getElementById("bankSection").style.display = state.showBank ? "" : "none";

  const body = document.getElementById("itemsBody");
  body.innerHTML = "";

  state.items.forEach((it,i) => {
    const converted = convert(it.unit);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${i+1}</td>
      <td>
        <span class="export-text">${it.desc}</span>
        <input class="editable-input" style="width:100%" type="text" value="${it.desc.replace(/"/g,'&quot;')}"
          oninput="state.items[${i}].desc=this.value;document.querySelectorAll('.export-text')[${i}].textContent=this.value">
      </td>
      <td>
        <span class="export-text">${it.qty}</span>
        <input class="editable-input editable-number" type="number" value="${it.qty}"
          onchange="state.items[${i}].qty=parseFloat(this.value)||0;recalc();document.querySelectorAll('.export-text-qty')[${i}].textContent=this.value">
      </td>
      <td class="amount">
        <span class="export-text export-text-price">${fmt(converted)}</span>
        <input class="editable-input editable-number" type="number" value="${converted.toFixed(2)}"
          onchange="state.items[${i}].unit=(parseFloat(this.value)||0)/getRate();recalc();this.previousElementSibling.textContent=fmt(parseFloat(this.value)||0)">
      </td>
      <td><button class="remove-btn" onclick="state.items.splice(${i},1);render()">✕</button></td>`;
    body.appendChild(tr);
  });

  recalc();
}

function recalc(){
  let total = 0;
  state.items.forEach(it => total += (parseFloat(it.qty)||0) * convert(it.unit));
  const disc = state.discount ? total * (state.discount/100) : 0;
  const dRow = document.getElementById("discountRow");
  if(state.discount > 0){
    dRow.style.display = "flex";
    dRow.textContent = `Discount ${state.discount}% applied: -${fmt(disc)}`;
  } else {
    dRow.style.display = "none";
  }
  document.getElementById("totalValue").textContent = fmt(total - disc);
}

document.getElementById("currencySelect").onchange = e => { state.currency = e.target.value; render(); };
document.getElementById("invoiceNumber").oninput  = e => { state.invoiceNumber = e.target.value; render(); };
document.getElementById("invoiceDate").oninput    = e => { state.date = e.target.value; render(); };
document.getElementById("billTo").oninput         = e => { state.billTo = e.target.value; render(); };
document.getElementById("discount").oninput       = e => { state.discount = parseFloat(e.target.value)||0; recalc(); };
document.getElementById("freeText").oninput       = e => { state.notes = e.target.value; render(); };
document.getElementById("rateUSD").oninput = render;
document.getElementById("rateEUR").oninput = render;
document.getElementById("bankToggle").onchange    = e => { state.showBank = e.target.value==="1"; render(); };

document.getElementById("addSelected").onclick = () => {
  const c = catalog[sel.value];
  state.items.push({desc:c.name, qty:1, unit:c.price});
  render();
};
document.getElementById("addItem").onclick = () => {
  state.items.push({desc:"New item", qty:1, unit:0});
  render();
};

// ── Export ────────────────────────────────────────────────────────────────────
// Before capturing: hide all inputs, show export-text spans so text never clips.
// Use scale:1 for smaller file; JPEG quality 0.85 for PDF to shrink further.

function advanceInvoiceNumber(){
  state.invoiceNumber = parseInt(state.invoiceNumber) + 1;
  document.getElementById("invoiceNumber").value = state.invoiceNumber;
  render();
}

async function exportCanvas(type){
  const page = document.getElementById("invoicePage");

  // Sync ALL editable inputs to their adjacent export-text spans before capture
  page.querySelectorAll("input.editable-input").forEach(inp => {
    const span = inp.previousElementSibling;
    if(span && span.classList.contains("export-text")){
      if(span.classList.contains("export-text-price")){
        span.textContent = fmt(parseFloat(inp.value)||0);
      } else {
        span.textContent = inp.value;
      }
    }
  });

  page.classList.add("export-mode");
  await new Promise(r => setTimeout(r, 50));

  const canvas = await html2canvas(page, {
    scale: type === "pdf" ? 1.5 : 1,
    useCORS: true,
    logging: false
  });

  page.classList.remove("export-mode");

  const invoiceNum = String(state.invoiceNumber).padStart(8,"0");

  if(type === "png"){
    canvas.toBlob(b => {
      const a = document.createElement("a");
      a.download = `invoice-${invoiceNum}.png`;
      a.href = URL.createObjectURL(b);
      a.click();
      advanceInvoiceNumber();
    }, "image/png");
  } else {
    const imgData = canvas.toDataURL("image/jpeg", 0.85);
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:"pt", format:"a4"});
    pdf.addImage(imgData, "JPEG", 0, 0, 595.28, 841.89);
    pdf.save(`invoice-${invoiceNum}.pdf`);
    advanceInvoiceNumber();
  }
}

document.getElementById("exportPng").onclick = () => exportCanvas("png");
document.getElementById("exportPdf").onclick = () => exportCanvas("pdf");

document.getElementById("invoiceDate").value = state.date;
render();
</script>
</body>
</html>
